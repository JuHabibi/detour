name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # Pas de DATABASE_URL : les tests Postgres optionnels restent skippés
        # (PGlite / mocks suffisent ; aucune connexion Neon).
        run: npm test

      - name: Typecheck
        # `LayoutProps` / routes typées exigent les defs générées par Next
        # (`next-env.d.ts` + `.next/types`), absentes après un simple `npm ci`.
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        env:
          # Valeurs factices non sensibles — nécessaires à l’instanciation
          # du pool / Better Auth pendant `next build`, sans connexion réelle.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-for-production
        run: npm run build
