  "description": "De l’équipe de France de Kung-Fu aux punchlines aiguisées du rap, Mona Guba fait de chaque mot une frappe maîtrisée.     Audacieuse, insolente mais toujours drôle, Mona Guba est une vraie fan, une groupie passionnée de son art, prête à tout pour casser Internet.      Entre force, finesse et folie, elle transforme l’énergie du tatamis en flow percutant — et personne ne sort indemne de son univers.      Dans un monde où le simple fait d&#039;être une femme dans ce milieu incarne un combat, Mona articule des textes à la fois piquants et sincères.      Elle mélange les genres pour transmettre des messages puissants, tout en gardant une touche d’humour. La scène devient son terrain de jeu, où le sérieux côtoie la dérision        IMPARFAIT pose les mots comme on jette des pavés : sans filtre, sans détour, avec une rage lucide et le goût du réel en bouche. Ici c’est la scène qui parle, et elle ne dit pas merci.   Révélé en 2022 en support de tournée des Nova Twins, IMPARFAIT s’est imposé comme le groupe incontournable de la scène alternative. Leur premier album “Telema”, sorti cette même année sur leur propre label Telema Records, les propulse sur une tournée de plus de 50 dates à travers tout le territoire et conforte leur réputation de bête de scène.     Mené par une frontwoman volcanique, le duo formé par Prisca et Bruno pousse le rock dans ses retranchements. En concert, c’est en trio que le groupe défend ses compositions avec une configuration ultra percutante et sans artifices : les textes de Prisca se calquent sur un duo basse/batterie ravageur qui s’assoit sans rougir à la table des groupes les plus impactants de la scène française.        Evénement proposé dans le cadre de la journée Campus en Fête et du lancement de la saison culturelle anniversaire des 15 ans du Bouillon. ",
